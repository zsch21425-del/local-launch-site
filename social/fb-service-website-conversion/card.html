<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    width:1080px;height:1080px;
    background:#FAF6F0; /* bright cream */
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex;flex-direction:column;
  }
  .brand{
    padding:56px 0 0 64px;
    display:flex;align-items:center;gap:10px;
    font-weight:800;letter-spacing:-.02em;font-size:30px;color:#1B1A18;
  }
  .brand .dot{color:#2CD4A9;font-weight:800}
  .content{
    flex:1;display:flex;flex-direction:column;justify-content:center;
    padding:0 64px 40px;
  }
  h1{
    font-size:82px;line-height:1.08;letter-spacing:-.02em;color:#1B1A18;
    font-weight:800;max-width:900px;
  }
  h1 .copper{color:#D4845B}
  h1 .teal{color:#2CD4A9}
  .sub{
    margin-top:34px;font-size:34px;color:#6B6258;font-weight:500;letter-spacing:-.01em;
  }
  .sub .teal{color:#2CD4A9;font-weight:700}
</style>
</head>
<body>
  <div class="brand">Local<span class="dot">Launch</span></div>
  <div class="content">
    <h1>A website has one job for a small business:<br><span class="copper">get the phone to ring</span> — <span class="teal">not win awards.</span></h1>
    <div class="sub">What actually converts in 2026 → <span class="teal">read the post</span></div>
  </div>
</body>
</html>
